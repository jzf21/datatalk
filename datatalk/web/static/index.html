<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DataTalk</title>
<script src="/static/vendor/chart.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa3b2; --accent: #6ea8fe; --ok: #4ade80;
    --bad: #f87171; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  #health { font-size: 12px; color: var(--muted); margin-left: auto; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); margin-right: 4px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; }
  nav button { background: none; border: none; color: var(--muted); padding: 8px 14px;
    cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 18px 20px; max-width: 900px; margin: 0 auto; }
  textarea, input[type=text] { width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 14px;
    font-family: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  select { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; font-size: 14px; }
  button.primary { background: var(--accent); color: #0b1220; border: none; border-radius: 8px;
    padding: 9px 16px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 8px; }
  button.primary:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-top: 14px; }
  .log { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .log .sql { color: var(--accent); white-space: pre-wrap; }
  .log .err { color: var(--bad); }
  /* markdown (Analyze tab + inline paragraph rendering) */
  .md h1,.md h2,.md h3 { line-height: 1.25; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
  .md code { font-family: var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--panel2); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .md table { border-collapse: collapse; } .md td,.md th { border: 1px solid var(--border); padding: 4px 8px; }
  /* block document renderer */
  .doc h1,.doc h2,.doc h3 { line-height: 1.25; margin: 14px 0 8px; }
  .doc h1 { font-size: 20px; } .doc h2 { font-size: 17px; } .doc h3 { font-size: 15px; }
  .doc p { margin: 8px 0; line-height: 1.5; }
  .doc code { font-family: var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .doc .tablewrap { overflow-x: auto; margin: 10px 0; }
  .doc table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .doc th, .doc td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .doc th { background: var(--panel2); color: var(--muted); font-weight: 600; }
  .doc .chartwrap { margin: 14px 0; padding: 10px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 8px; }
  .doc .chart-title { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .doc .note { color: var(--muted); font-style: italic; }
  /* dashboard grid */
  .doc .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; margin: 12px 0; }
  .doc .grid > * { min-width: 0; grid-column: span 12; }
  @media (min-width: 640px) { .doc .grid > .cell { grid-column: span var(--w, 6); } }
  .doc .stat { background: var(--panel2); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; }
  .doc .stat .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .doc .stat .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .doc .stat .delta { font-size: 13px; margin-top: 4px; }
  .doc .stat .delta.up { color: var(--ok); } .doc .stat .delta.down { color: var(--bad); }
  .sug { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid var(--border); }
  .sug button { background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; cursor: pointer; padding: 2px 8px; }
  label.check { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; }
  /* Q&A chat */
  .turn { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
  .turn .q { font-weight: 600; margin-bottom: 6px; }
  .turn .q::before { content: "Q "; color: var(--accent); }
  .ask-row { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
  .ask-row input { flex: 1; }
  .ask-row button { margin-top: 0; }
</style>
</head>
<body>
<header>
  <h1>DataTalk</h1>
  <span class="muted">reports from your ClickHouse data</span>
  <span id="health"><span class="dot"></span>checking…</span>
</header>
<nav>
  <button data-tab="report" class="active">Report</button>
  <button data-tab="dashboard">Dashboard</button>
  <button data-tab="analyze">Analyze</button>
  <button data-tab="memory">Memory</button>
</nav>
<main>
  <!-- REPORT -->
  <section id="tab-report">
    <textarea id="req" placeholder="Ask for a report, e.g. 'Summarize ticket resolution trends by account over the last 6 months and flag accounts at risk.'"></textarea>
    <label class="check"><input type="checkbox" id="useMem" checked /> use learned suggestions</label>
    <div class="row">
      <button class="primary" id="go">Generate report</button>
      <select id="openReport" style="margin-top:8px">
        <option value="">— open a past report —</option>
      </select>
    </div>
    <div class="card" id="progress" style="display:none">
      <div class="log" id="log"></div>
    </div>
    <div class="card doc" id="report" style="display:none"></div>

    <!-- Q&A chat panel -->
    <div class="card" id="qa" style="display:none">
      <div class="muted" style="margin-bottom:8px">Ask about this report</div>
      <div id="qaTurns"></div>
      <div class="ask-row">
        <input type="text" id="qInput" placeholder="e.g. 'Which account had the sharpest drop last month?'" />
        <button class="primary" id="askBtn">Ask</button>
      </div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="tab-dashboard" style="display:none">
    <textarea id="dashReq" placeholder="Describe a dashboard, e.g. 'KPI dashboard of ticket volume, resolution time, and SLA breach rate by month.'"></textarea>
    <label class="check"><input type="checkbox" id="dashUseMem" checked /> use learned suggestions</label>
    <div class="row">
      <button class="primary" id="dashGo">Generate dashboard</button>
      <select id="openDashboard" style="margin-top:8px">
        <option value="">— open a saved dashboard —</option>
      </select>
    </div>
    <div class="card" id="dashProgress" style="display:none">
      <div class="log" id="dashLog"></div>
    </div>
    <div class="card doc" id="dashboard" style="display:none"></div>
    <div id="dashAnalyzeRow" style="display:none; margin-top:12px">
      <button class="primary" id="dashAnalyzeBtn">Analyze</button>
    </div>
    <div class="card md" id="dashAnalysis" style="display:none"></div>
  </section>

  <!-- ANALYZE -->
  <section id="tab-analyze" style="display:none">
    <p class="muted">Paste an external report to analyze, or analyze one DataTalk generated (pick from the list).</p>
    <div class="row">
      <select id="reportSelect" style="flex:1">
        <option value="">— external report (paste below) —</option>
      </select>
    </div>
    <textarea id="extText" placeholder="Paste report text here…" style="margin-top:8px"></textarea>
    <input type="text" id="focus" placeholder="Optional focus (e.g. 'data quality', 'risks')" style="margin-top:8px" />
    <div><button class="primary" id="goAnalyze">Analyze</button></div>
    <div class="card md" id="analysis" style="display:none"></div>
  </section>

  <!-- MEMORY -->
  <section id="tab-memory" style="display:none">
    <p class="muted">Teach DataTalk. Suggestions are stored and the relevant ones are fed into future reports.</p>
    <textarea id="sugText" placeholder="e.g. 'For SLA metrics use jira.sla_events; an account is at-risk if breach rate > 5%.'"></textarea>
    <div><button class="primary" id="addSug">Add suggestion</button></div>
    <div id="sugList" style="margin-top:14px"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const api = (p, o) => fetch(p, o).then(r => r.json());
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const CHART_COLORS = ['#6ea8fe','#4ade80','#f87171','#fbbf24','#a78bfa','#38bdf8','#fb923c','#34d399'];

// --- tabs ---
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  ['report','dashboard','analyze','memory'].forEach(t =>
    $('#tab-'+t).style.display = (t === b.dataset.tab) ? '' : 'none');
  if (b.dataset.tab === 'memory') loadSuggestions();
  if (b.dataset.tab === 'analyze') loadReports();
  if (b.dataset.tab === 'report') loadReportPicker();
  if (b.dataset.tab === 'dashboard') loadDashboardPicker();
});

// --- inline markdown (bold, italic, code) ---
function inline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
}

// --- full markdown renderer (Analyze tab output only) ---
function md(src) {
  const lines = (src || '').split('\n');
  let html = '', inList = false, inCode = false, code = '';
  for (const ln of lines) {
    if (ln.trim().startsWith('```')) {
      if (inCode) { html += '<pre><code>'+esc(code)+'</code></pre>'; code=''; }
      inCode = !inCode; continue;
    }
    if (inCode) { code += ln + '\n'; continue; }
    const h = ln.match(/^(#{1,3})\s+(.*)/);
    if (h) { if(inList){html+='</ul>';inList=false;} html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if (/^\s*[-*]\s+/.test(ln)) { if(!inList){html+='<ul>';inList=true;} html += '<li>'+inline(ln.replace(/^\s*[-*]\s+/,''))+'</li>'; continue; }
    if (/^\s*\|.*\|\s*$/.test(ln)) { html += renderRow(ln); continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (ln.trim() === '') html += '';
    else html += '<p>'+inline(ln)+'</p>';
  }
  if (inList) html += '</ul>';
  return html.replace(/(<tr>.*<\/tr>)+/s, m => '<table>'+m+'</table>');
}
function renderRow(ln) {
  const cells = ln.trim().replace(/^\||\|$/g,'').split('|');
  if (cells.every(c => /^\s*:?-+:?\s*$/.test(c))) return '';
  return '<tr>' + cells.map(c => '<td>'+inline(c.trim())+'</td>').join('') + '</tr>';
}

// --- block document renderer ---
const _charts = [];   // live Chart.js instances, destroyed on re-render
function destroyCharts() { while (_charts.length) { try { _charts.pop().destroy(); } catch(e){} } }

function renderDocument(container, doc) {
  container.innerHTML = '';
  const blocks = (doc && doc.blocks) || [];
  for (const b of blocks) container.appendChild(renderBlock(b));
}

function renderBlock(b) {
  if (b.type === 'heading') {
    const lvl = Math.min(3, Math.max(1, b.level || 2));
    const el = document.createElement('h'+lvl);
    el.innerHTML = inline(b.text || '');
    return el;
  }
  if (b.type === 'paragraph') {
    const el = document.createElement('p');
    el.innerHTML = inline(b.text || '');
    if ((b.text || '').startsWith('_') && (b.text || '').endsWith('_')) el.className = 'note';
    return el;
  }
  if (b.type === 'table') return renderTable(b);
  if (b.type === 'chart') return renderChart(b);
  if (b.type === 'row') return renderRowBlock(b);
  if (b.type === 'stat') return renderStat(b);
  const el = document.createElement('p'); el.textContent = ''; return el;
}

function renderRowBlock(b) {
  const grid = document.createElement('div'); grid.className = 'grid';
  const children = b.children || [];
  const even = Math.max(1, Math.round(12 / children.length));
  for (const c of children) {
    const cell = document.createElement('div'); cell.className = 'cell';
    let w = c.width == null ? even : c.width;
    w = Math.max(1, Math.min(12, w));
    cell.style.setProperty('--w', w);
    cell.appendChild(renderBlock(c));
    grid.appendChild(cell);
  }
  return grid;
}

function renderStat(b) {
  const el = document.createElement('div'); el.className = 'stat';
  const label = document.createElement('div'); label.className = 'label';
  label.textContent = b.label || '';
  const value = document.createElement('div'); value.className = 'value';
  const unit = b.unit || '';
  const v = b.value == null ? '—' : b.value;
  value.textContent = (unit === '$' ? unit + v : String(v) + unit);
  el.append(label, value);
  if (b.delta != null) {
    const d = document.createElement('div');
    const up = Number(b.delta) >= 0;
    d.className = 'delta ' + (up ? 'up' : 'down');
    const pct = b.delta_pct == null ? '' : ` (${up ? '+' : ''}${Number(b.delta_pct).toFixed(1)}%)`;
    d.textContent = `${up ? '▲' : '▼'} ${b.delta}${pct}`;
    el.appendChild(d);
  }
  return el;
}

function renderTable(b) {
  const wrap = document.createElement('div'); wrap.className = 'tablewrap';
  const cols = b.columns || [];
  const rows = b.rows || [];
  const head = '<tr>' + cols.map(c => '<th>'+esc(c)+'</th>').join('') + '</tr>';
  const body = rows.map(r => '<tr>' + r.map(c => '<td>'+esc(c == null ? '' : c)+'</td>').join('') + '</tr>').join('');
  wrap.innerHTML = '<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
  return wrap;
}

function renderChart(b) {
  const wrap = document.createElement('div'); wrap.className = 'chartwrap';
  if (b.title) {
    const t = document.createElement('div'); t.className = 'chart-title'; t.textContent = b.title;
    wrap.appendChild(t);
  }
  const canvas = document.createElement('canvas');
  wrap.appendChild(canvas);
  const labels = (b.x && b.x.values) || [];
  const series = b.series || [];
  const isArea = b.chart_type === 'area';
  const kind = isArea ? 'line' : (b.chart_type || 'bar');
  const datasets = series.map((s, i) => {
    const color = CHART_COLORS[i % CHART_COLORS.length];
    if (kind === 'pie') {
      return { label: s.name, data: s.values,
        backgroundColor: s.values.map((_, j) => CHART_COLORS[j % CHART_COLORS.length]) };
    }
    return {
      label: s.name, data: s.values,
      borderColor: color,
      backgroundColor: (kind === 'line' && !isArea) ? color : color + '55',
      fill: isArea, tension: 0.25,
    };
  });
  // For pie, use the first series' name as labels come from x.
  const cfg = {
    type: kind,
    data: { labels: kind === 'pie' ? labels : labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { labels: { color: '#9aa3b2' } } },
      scales: kind === 'pie' ? {} : {
        x: { ticks: { color: '#9aa3b2' }, grid: { color: '#2a2f3a' } },
        y: { ticks: { color: '#9aa3b2' }, grid: { color: '#2a2f3a' } },
      },
    },
  };
  // Defer instantiation until the canvas is in the DOM.
  setTimeout(() => { try { _charts.push(new Chart(canvas.getContext('2d'), cfg)); } catch(e){} }, 0);
  return wrap;
}

// --- health ---
async function loadHealth() {
  try {
    const h = await api('/api/health');
    const ch = h.clickhouse.ok, oa = h.openai.ok;
    const cls = (ch && oa) ? 'ok' : 'bad';
    $('#health').innerHTML = `<span class="dot ${cls}"></span>`
      + `ClickHouse: ${ch ? h.clickhouse.table_count+' tables' : 'down'} · `
      + `OpenAI: ${oa ? 'ok' : 'down'}`;
  } catch(e) { $('#health').innerHTML = '<span class="dot bad"></span>error'; }
}
loadHealth();

// --- streaming helper (NDJSON) ---
async function streamNDJSON(url, body, onEvent) {
  const resp = await fetch(url, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
      if (!line) continue;
      onEvent(JSON.parse(line));
    }
  }
}

// --- report generation ---
let currentReportId = null;

$('#go').onclick = async () => {
  const request = $('#req').value.trim();
  if (!request) return;
  $('#go').disabled = true;
  currentReportId = null;
  $('#qa').style.display = 'none'; $('#qaTurns').innerHTML = '';
  $('#progress').style.display = ''; $('#log').innerHTML = '';
  $('#report').style.display = 'none'; destroyCharts(); $('#report').innerHTML = '';
  const log = m => { $('#log').innerHTML += m + '<br>'; $('#log').scrollTop = 1e9; };

  try {
    await streamNDJSON('/api/report', { request, use_memory: $('#useMem').checked },
      ev => handleGenEvent(ev, log));
  } catch (e) { log('<span class="err">'+e+'</span>'); }
  finally { $('#go').disabled = false; }
};

function handleGenEvent(ev, log) {
  const d = ev.data || {};
  if (ev.kind === 'status') log('· ' + d.message);
  else if (ev.kind === 'memory') log('· using ' + d.count + ' learned suggestion(s)');
  else if (ev.kind === 'plan') log('· plan: ' + (d.sections||[]).map(s => s.title).join(' › '));
  else if (ev.kind === 'sql') log('<span class="sql">SQL » ' + esc(d.sql) + '</span>');
  else if (ev.kind === 'result') log('  ↳ ' + d.row_count + ' row(s) → ' + d.dataset_id);
  else if (ev.kind === 'error') log('<span class="err">! ' + esc(d.message) + '</span>');
  else if (ev.kind === 'report') {
    $('#report').style.display = ''; destroyCharts(); renderDocument($('#report'), d.document);
  } else if (ev.kind === 'saved') {
    log('· saved as report #' + d.report_id);
    currentReportId = d.report_id;
    $('#qa').style.display = ''; $('#qaTurns').innerHTML = '';
    loadReportPicker();
  }
}

// --- Q&A chat ---
$('#askBtn').onclick = ask;
$('#qInput').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

async function ask() {
  const question = $('#qInput').value.trim();
  if (!question || !currentReportId) return;
  $('#qInput').value = ''; $('#askBtn').disabled = true;

  const turn = document.createElement('div'); turn.className = 'turn';
  const q = document.createElement('div'); q.className = 'q'; q.textContent = question;
  const logEl = document.createElement('div'); logEl.className = 'log';
  const answer = document.createElement('div'); answer.className = 'doc';
  turn.append(q, logEl, answer);
  $('#qaTurns').appendChild(turn);
  const log = m => { logEl.innerHTML += m + '<br>'; };

  try {
    await streamNDJSON('/api/reports/' + currentReportId + '/ask', { question }, ev => {
      const d = ev.data || {};
      if (ev.kind === 'status') log('· ' + d.message);
      else if (ev.kind === 'sql') log('<span class="sql">SQL » ' + esc(d.sql) + '</span>');
      else if (ev.kind === 'result') log('  ↳ ' + d.row_count + ' row(s) → ' + d.dataset_id);
      else if (ev.kind === 'error') log('<span class="err">! ' + esc(d.message) + '</span>');
      else if (ev.kind === 'answer') { logEl.style.display = 'none'; renderDocument(answer, d.document); }
    });
  } catch (e) { log('<span class="err">'+e+'</span>'); }
  finally { $('#askBtn').disabled = false; }
}

// --- open a past report (rehydrate blocks + prior Q&A) ---
async function loadReportPicker() {
  const { reports } = await api('/api/reports');
  const sel = $('#openReport');
  sel.innerHTML = '<option value="">— open a past report —</option>' +
    reports.map(r => `<option value="${r.id}">#${r.id}: ${esc(r.request.slice(0,60))}</option>`).join('');
}
$('#openReport').onchange = async () => {
  const id = $('#openReport').value;
  if (!id) return;
  const r = await api('/api/reports/' + id);
  currentReportId = r.id;
  $('#req').value = r.request;
  $('#progress').style.display = 'none';
  $('#report').style.display = ''; destroyCharts(); renderDocument($('#report'), r.document);
  $('#qa').style.display = ''; $('#qaTurns').innerHTML = '';
  for (const t of (r.qa_turns || [])) {
    const turn = document.createElement('div'); turn.className = 'turn';
    const q = document.createElement('div'); q.className = 'q'; q.textContent = t.question;
    const answer = document.createElement('div'); answer.className = 'doc';
    turn.append(q, answer);
    $('#qaTurns').appendChild(turn);
    renderDocument(answer, t.document);
  }
};
loadReportPicker();

// --- analyze ---
async function loadReports() {
  const { reports } = await api('/api/reports');
  const sel = $('#reportSelect');
  sel.innerHTML = '<option value="">— external report (paste below) —</option>' +
    reports.map(r => `<option value="${r.id}">#${r.id}: ${esc(r.request.slice(0,60))}</option>`).join('');
}
$('#goAnalyze').onclick = async () => {
  const id = $('#reportSelect').value;
  const body = { focus: $('#focus').value || null };
  if (id) body.report_id = parseInt(id);
  else body.text = $('#extText').value;
  $('#goAnalyze').disabled = true;
  $('#analysis').style.display = ''; $('#analysis').innerHTML = '<span class="muted">Analyzing…</span>';
  try {
    const r = await api('/api/analyze', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    $('#analysis').innerHTML = r.analysis ? md(r.analysis) : ('<span class="err">'+(r.detail||'error')+'</span>');
  } catch(e){ $('#analysis').innerHTML = '<span class="err">'+e+'</span>'; }
  finally { $('#goAnalyze').disabled = false; }
};

// --- memory ---
async function loadSuggestions() {
  const { suggestions } = await api('/api/suggestions');
  $('#sugList').innerHTML = suggestions.length ? suggestions.map(s =>
    `<div class="sug"><span>${esc(s.text)}</span><button data-id="${s.id}">delete</button></div>`).join('')
    : '<p class="muted">No suggestions yet.</p>';
  $('#sugList').querySelectorAll('button').forEach(b => b.onclick = async () => {
    await fetch('/api/suggestions/'+b.dataset.id, { method:'DELETE' }); loadSuggestions();
  });
}
$('#addSug').onclick = async () => {
  const text = $('#sugText').value.trim(); if (!text) return;
  $('#addSug').disabled = true;
  await api('/api/feedback', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }) });
  $('#sugText').value = ''; $('#addSug').disabled = false; loadSuggestions();
};

// --- dashboards ---
let currentDashboardId = null;

$('#dashGo').onclick = async () => {
  const request = $('#dashReq').value.trim();
  if (!request) return;
  $('#dashGo').disabled = true;
  currentDashboardId = null;
  $('#dashProgress').style.display = ''; $('#dashLog').innerHTML = '';
  $('#dashboard').style.display = 'none'; destroyCharts(); $('#dashboard').innerHTML = '';
  $('#dashAnalyzeRow').style.display = 'none';
  $('#dashAnalysis').style.display = 'none'; $('#dashAnalysis').innerHTML = '';
  const log = m => { $('#dashLog').innerHTML += m + '<br>'; $('#dashLog').scrollTop = 1e9; };
  try {
    await streamNDJSON('/api/dashboard', { request, use_memory: $('#dashUseMem').checked }, ev => {
      const d = ev.data || {};
      if (ev.kind === 'status') log('· ' + d.message);
      else if (ev.kind === 'memory') log('· using ' + d.count + ' learned suggestion(s)');
      else if (ev.kind === 'plan') log('· plan: ' + (d.sections||[]).map(s => s.title).join(' › '));
      else if (ev.kind === 'sql') log('<span class="sql">SQL » ' + esc(d.sql) + '</span>');
      else if (ev.kind === 'result') log('  ↳ ' + d.row_count + ' row(s) → ' + d.dataset_id);
      else if (ev.kind === 'error') log('<span class="err">! ' + esc(d.message) + '</span>');
      else if (ev.kind === 'dashboard') {
        $('#dashboard').style.display = ''; destroyCharts(); renderDocument($('#dashboard'), d.document);
      } else if (ev.kind === 'saved') {
        log('· saved as dashboard #' + d.dashboard_id);
        currentDashboardId = d.dashboard_id;
        $('#dashAnalyzeRow').style.display = '';
        loadDashboardPicker();
      }
    });
  } catch (e) { log('<span class="err">'+e+'</span>'); }
  finally { $('#dashGo').disabled = false; }
};

$('#dashAnalyzeBtn').onclick = async () => {
  if (!currentDashboardId) return;
  $('#dashAnalyzeBtn').disabled = true;
  $('#dashAnalysis').style.display = ''; $('#dashAnalysis').innerHTML = '<span class="muted">Analyzing…</span>';
  try {
    const r = await api('/api/dashboards/' + currentDashboardId + '/analyze',
      { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ focus: null }) });
    $('#dashAnalysis').innerHTML = r.analysis ? md(r.analysis) : ('<span class="err">'+(r.detail||'error')+'</span>');
  } catch(e){ $('#dashAnalysis').innerHTML = '<span class="err">'+e+'</span>'; }
  finally { $('#dashAnalyzeBtn').disabled = false; }
};

async function loadDashboardPicker() {
  const { dashboards } = await api('/api/dashboards');
  const sel = $('#openDashboard');
  sel.innerHTML = '<option value="">— open a saved dashboard —</option>' +
    dashboards.map(d => `<option value="${d.id}">#${d.id}: ${esc((d.title||d.request).slice(0,60))}</option>`).join('');
}
$('#openDashboard').onchange = async () => {
  const id = $('#openDashboard').value;
  if (!id) return;
  const d = await api('/api/dashboards/' + id);
  currentDashboardId = d.id;
  $('#dashReq').value = d.request;
  $('#dashProgress').style.display = 'none';
  $('#dashboard').style.display = ''; destroyCharts(); renderDocument($('#dashboard'), d.document);
  $('#dashAnalyzeRow').style.display = '';
  $('#dashAnalysis').style.display = d.analysis ? '' : 'none';
  $('#dashAnalysis').innerHTML = d.analysis ? md(d.analysis) : '';
};
loadDashboardPicker();
</script>
</body>
</html>
