# Local Postgres for DataTalk (application storage: orgs, users, memory, reports).
#
#   docker compose up -d
#   datatalk-db upgrade
#
# Port 5433 on the host, not 5432, so this never collides with an existing
# local Postgres. Two databases are created: `datatalk` for development and
# `datatalk_test` for the test suite -- tests refuse to run against the dev URL.
services:
  postgres:
    image: postgres:16
    container_name: datatalk-postgres
    environment:
      POSTGRES_USER: datatalk
      POSTGRES_PASSWORD: datatalk
      POSTGRES_DB: datatalk
    ports:
      - "5433:5432"
    volumes:
      - datatalk-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datatalk -d datatalk"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: a ClickHouse to host the eval fixture's `events` source.
  #
  #   docker compose --profile evals up -d
  #   datatalk-eval seed --events-engine clickhouse
  #
  # Behind a profile because nothing else in the project needs it. It exists so
  # the eval suite can be genuinely cross-engine: with events on ClickHouse and
  # sales on Postgres, a single question forces the agent to write two dialects
  # and route each statement to the source that speaks it. That is the property
  # the multi-source design claims, and it cannot be measured on one engine.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: datatalk-clickhouse
    profiles: ["evals"]
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP, which is what clickhouse-connect speaks
      - "9000:9000"   # native, for clickhouse-client if you want a shell
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - datatalk-chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  datatalk-pgdata:
  datatalk-chdata:
