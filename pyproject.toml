[project]
name = "datatalk"
version = "0.1.0"
description = "Schema-agnostic LLM report generation and analysis over ClickHouse and Postgres"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "clickhouse-connect>=0.7",
    "pydantic>=2.6",
    "pydantic[email]>=2.6",  # EmailStr validation on signup/login
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # [pool] powers the per-source Postgres warehouse pools; a bare connection
    # would serialize the parallel agent threads that share one warehouse.
    "psycopg[binary,pool]>=3.1",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    # LLM observability. Inert without LANGFUSE_* credentials -- see
    # datatalk/observability.py -- but a hard dependency rather than an extra so
    # that `import datatalk.observability` cannot differ between environments.
    "langfuse>=4.14,<5",
    # The Jira client (integrations/jira). Already required by the test suite
    # via fastapi.testclient; now a runtime dependency in its own right.
    "httpx>=0.27",
]

[project.optional-dependencies]
# httpx is required by fastapi.testclient.TestClient; it was previously pulled
# in transitively and never declared.
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
datatalk-check = "datatalk.scripts.check_connection:main"
datatalk-db = "datatalk.scripts.db:main"
datatalk-import-sqlite = "datatalk.scripts.import_sqlite:main"
# Refresh synced sources (Jira) -- run from cron; see docs/jira.md.
datatalk-sync = "datatalk.scripts.sync:main"
# Offline evaluation of the agents against a seeded fixture. Ships with the
# package rather than living in a scripts/ directory so `datatalk-eval` works
# from an install, which is what makes it runnable in CI.
datatalk-eval = "datatalk.evals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datatalk*"]

[tool.setuptools.package-data]
# The eval suite and its context model are data, not code, but they must travel
# with the package: `datatalk-eval` resolves them relative to __file__, so a
# wheel that omitted them would install a CLI with nothing to run.
"datatalk.evals" = ["suites/*.json", "context/*.md", "context/*.json", "context/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
