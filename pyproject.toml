[project]
name = "datatalk"
version = "0.1.0"
description = "Schema-agnostic LLM report generation and analysis over ClickHouse Jira data"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "clickhouse-connect>=0.7",
    "pydantic>=2.6",
    "pydantic[email]>=2.6",  # EmailStr validation on signup/login
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "cryptography>=42",
]

[project.optional-dependencies]
# httpx is required by fastapi.testclient.TestClient; it was previously pulled
# in transitively and never declared.
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
datatalk-check = "datatalk.scripts.check_connection:main"
datatalk-db = "datatalk.scripts.db:main"
datatalk-import-sqlite = "datatalk.scripts.import_sqlite:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datatalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
